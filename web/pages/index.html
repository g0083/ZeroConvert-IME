<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroConvert IME · ブラウザ実行テスト</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./check.js"></script>
  <script type="module" src="./model-input.mjs"></script>
</head>
<body>
  <main>
    <p class="brand">ZeroConvert IME</p>
    <h1>ブラウザでかな漢字変換</h1>
    <p>ローマ字で入力すると、Windows 版と同じ ZeroCon Model Nano v4.1 と Swift 変換エンジンが候補を出します。</p>
    <section aria-labelledby="input-heading">
      <h2 id="input-heading">入力を試す</h2>
      <p id="conversion-status" role="status">変換エンジン、辞書、モデルを読み込み中…</p>
      <label for="romaji">ローマ字</label>
      <div class="input-bar">
        <div class="composition-field">
          <div class="composition-display" aria-hidden="true"><span id="confirmed"></span><span id="composition"></span></div>
          <textarea id="romaji" rows="3" maxlength="256" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-describedby="keyboard-help" disabled></textarea>
        </div>
        <button id="sample" type="button" disabled>入力例</button>
      </div>
      <p id="keyboard-help" class="hint">Space で候補切替、Enter で確定、Esc で取消</p>
      <p id="reading" aria-live="polite"></p>
      <iframe id="candidate-window" title="変換候補" src="./candidate-window.html" hidden></iframe>
    </section>
    <section aria-labelledby="heading">
      <h2 id="heading">ブラウザ実行テスト</h2>
      <p id="status" role="status">WebAssembly を読み込み中…</p>
      <ul id="results"></ul>
      <button id="run" type="button" disabled>もう一度実行</button>
    </section>
  </main>
</body>
</html>
