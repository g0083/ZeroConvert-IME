name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_candidate_ui:
        description: Run candidate UI CSS checks (known pre-existing spacing mismatch)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  shared-conversion-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Shared Windows and Android conversion policy tests
        run: cargo test --locked --manifest-path engine/rust/Cargo.toml --lib -- --test-threads=1
      - name: Shared Rust formatting
        run: cargo fmt --manifest-path engine/rust/Cargo.toml -- --check
  shared-engine-inputs:
    # The Android host compiles the Windows Swift sources and the pinned
    # converter. Nothing else in CI reads them, so a Windows-side change could
    # break only the Android build. These checks need no NDK or Swift toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Converter patch anchors
        run: python scripts/run.py windows/scripts/test_converter_patch.py
      - name: Pinned converter still matches the patch anchors
        run: python scripts/run.py windows/scripts/prepare-modern-llama.py --check-converter
      - name: Stage the shared Swift sources
        # Runs the real staging step, so a converter patch that no longer
        # applies, a missing dictionary submodule, or an unparsable dependency
        # pin fails here instead of only in the Android build.
        run: node scripts/prepare-shared-engine.mjs
      - name: Android Swift pins match the Windows pins
        run: node scripts/check-shared-engine-pins.mjs
      - name: Shared engine fingerprint inputs
        run: node scripts/check-shared-engine-inputs.mjs
      - name: Committed engine lock matches the staged sources
        run: node scripts/check-shared-engine-lock.mjs
  source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source tree
        run: python scripts/check_repository.py
      - name: Dataset isolation regression tests
        run: python scripts/run.py data/test_dataset_isolation.py
      - name: Corrector training data and encoding tests
        run: |
          python scripts/run.py data/test_corrector_dataset.py
          python scripts/run.py training/test_corrector_encoding.py
      - name: Frontend behavior tests
        working-directory: windows/frontend
        run: npm test
      - name: Candidate scroller tests
        if: github.event_name == 'workflow_dispatch' && inputs.check_candidate_ui
        working-directory: windows
        run: node --test crates/ui/tests/candidate_scroller.test.cjs
      - name: Reverse dictionary generator tests
        working-directory: windows
        run: node --test scripts/generate-reverse-dictionary.test.mjs
