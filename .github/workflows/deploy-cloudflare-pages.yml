name: Build and deploy ZeroConvert IME to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'windows/server-swift/**'
      - 'windows/deployment/**'
      - 'windows/crates/ui/**'
      - 'windows/native/keyboard-prior/**'
      - 'windows/scripts/**'
      - 'android/**'
      - 'web/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine/rust -> target
            web/live-policy -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute dictionary submodule revision
        id: revs
        run: |
          echo "dict_rev=$(git rev-parse HEAD:windows/server-swift/azooKey_dictionary_storage)" >> "$GITHUB_OUTPUT"

      # --- Artifact-level caches ---
      - name: Cache built multi-threaded Emscripten llama.cpp Wasm
        id: llama-mt-cache
        uses: actions/cache@v4
        with:
          path: |
            dist/pages-cache/zerocon_llama_mt.mjs
            dist/pages-cache/zerocon_llama_mt.wasm
            dist/pages-cache/zerocon_llama_mt.worker.*
            dist/pages-cache/LLAMA-LICENSE.txt
          key: zerocon-llama-mt-v1-${{ hashFiles('windows/scripts/prepare-modern-llama.py', 'patches/llama.cpp/**', 'web/stage-llama.py', 'web/build-llama-mt.py', 'web/llama-mt-bridge.cpp', 'engine/native/keyboard_assist.*', 'windows/native/keyboard-prior/**') }}

      - name: Cache built Swift model Wasm (bridged to MT llama)
        id: swift-model-cache
        uses: actions/cache@v4
        with:
          path: |
            dist/pages-cache/zerocon_model.wasm
            dist/pages-cache/CONVERTER-LICENSE.txt
          key: zerocon-swift-model-mt-v1-${{ hashFiles('engine/Package.resolved', 'windows/scripts/prepare-modern-llama.py', 'patches/llama.cpp/**', 'windows/server-swift/Sources/azookey-server/**', 'windows/server-swift/Sources/ffi/**', 'web/stage-dictionary.py', 'web/ModelBridge.swift', 'web/WasiDispatchShim.swift', 'web/wasi-llama-bridge.c') }}

      - name: Cache packed dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: |
            dist/pages-cache/dictionary.gz
            dist/pages-cache/reverse-v2.bin.gz
            dist/pages-cache/DICTIONARY-LICENSE.txt
          key: zerocon-dict-v1-${{ steps.revs.outputs.dict_rev }}-${{ hashFiles('windows/scripts/generate-reverse-dictionary.mjs', 'web/pack-dictionary.py') }}

      - name: Cache downloaded catalog GGUF model
        id: model-gguf-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/model-cache
          key: zerocon-model-gguf-v1-${{ hashFiles('windows/deployment/model-catalog.json', 'windows/deployment/settings.json') }}

      # --- Setup Emscripten only when MT llama needs rebuilding ---
      - name: Setup Emscripten SDK
        if: steps.llama-mt-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
          actions-cache-folder: 'emsdk-cache'

      # --- Setup Swift WASI SDK only when Swift model Wasm needs rebuilding ---
      - name: Restore or fetch Swift 6.4.2 and WASI SDK
        id: swift-cache
        if: steps.swift-model-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zerocon-swift
          key: zerocon-swift-6.4.2-ubuntu2204-wasip1

      - name: Install Swift and WASI SDK
        if: steps.swift-model-cache.outputs.cache-hit != 'true' && steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          swift_root="$RUNNER_TEMP/zerocon-swift"
          mkdir -p "$swift_root"
          cd "$swift_root"
          server=https://download.swift.org/swift-6.4.2-release
          curl --fail --silent --show-error --location --retry 3 "$server/ubuntu2204/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu22.04.tar.gz" -o swift-linux.tar.gz
          curl --fail --silent --show-error --location --retry 3 "$server/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz" -o swift-wasm.tar.gz
          echo 'c3081b1817117c66e4764d2a148357d997200048922c778b0f08c795833ae06d  swift-linux.tar.gz' | sha256sum --check
          echo '83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5  swift-wasm.tar.gz' | sha256sum --check
          tar -xzf swift-linux.tar.gz
          tar -xzf swift-wasm.tar.gz
          rm -f swift-linux.tar.gz swift-wasm.tar.gz

      - name: Install wasm-opt (binaryen) if available
        if: steps.swift-model-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen || true

      - name: Build and check the shared Rust engines and web assets
        run: |
          cargo rustc --locked --manifest-path engine/rust/Cargo.toml --target wasm32-wasip1 --release --lib --crate-type cdylib -- -C link-arg=--export=malloc -C link-arg=--export=free
          node web/check-assist-wasm.cjs engine/rust/target/wasm32-wasip1/release/zerocon_engine.wasm
          cargo rustc --locked --manifest-path web/live-policy/Cargo.toml --target wasm32-wasip1 --release -- -C link-arg=--export=malloc -C link-arg=--export=free
          node web/check-session-wasm.cjs web/live-policy/target/wasm32-wasip1/release/zerocon_web_live_policy.wasm
          node web/check-worker-session.mjs
          node web/check-worker-assist.mjs
          node web/check-assist-session.mjs
          node web/check-learning-store.mjs
          node web/check-settings-store.mjs
          node web/check-load-progress.mjs
          node web/check-release-downloads.mjs
          mkdir -p dist/pages dist/pages-cache
          cp web/pages/index.html web/pages/style.css web/pages/android-keyboard.css web/pages/android-keyboard.mjs web/pages/dictionary-engine.mjs web/pages/model-*.mjs web/pages/assist-session.mjs web/pages/learning-store.mjs web/pages/load-progress.mjs web/pages/release-downloads.mjs web/pages/settings-store.mjs dist/pages/
          python3 web/pack-android-keyboard.py dist/pages/android-keyboard-layout.mjs
          python3 web/pack-site-theme.py dist/pages/ime-theme.css
          cp web/unicode-emoji-license.txt dist/pages/
          cp windows/frontend/public/favicon.png dist/pages/
          cp engine/rust/target/wasm32-wasip1/release/zerocon_engine.wasm dist/pages/
          cp web/live-policy/target/wasm32-wasip1/release/zerocon_web_live_policy.wasm dist/pages/
          cp windows/LICENSE dist/pages/LICENSE.txt

      - name: Stage llama.cpp sources (when MT llama or Swift model needs rebuilding)
        if: steps.llama-mt-cache.outputs.cache-hit != 'true' || steps.swift-model-cache.outputs.cache-hit != 'true'
        run: |
          python3 web/stage-llama.py "$RUNNER_TEMP/llama-source" --windows-source "$RUNNER_TEMP/llama-windows-source" --for-emscripten

      - name: Build multi-threaded Emscripten llama.cpp (pthreads + SIMD128 + O3)
        if: steps.llama-mt-cache.outputs.cache-hit != 'true'
        run: |
          python3 web/build-llama-mt.py "$RUNNER_TEMP/llama-source" "$RUNNER_TEMP/llama-mt-build" dist/pages-cache/zerocon_llama_mt.mjs --pool-size 4
          cp "$RUNNER_TEMP/llama-source/LICENSE" dist/pages-cache/LLAMA-LICENSE.txt

      - name: Build Swift model Wasm (bridged to MT llama)
        if: steps.swift-model-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          swift_root="$RUNNER_TEMP/zerocon-swift"
          converter=$(python3 windows/scripts/prepare-modern-llama.py --converter-only | python3 -c 'import json,sys; print(json.load(sys.stdin)["converter"])')
          python3 web/stage-dictionary.py "$converter" "$RUNNER_TEMP/model-source" --llama-source "$RUNNER_TEMP/llama-source" --llama-bridge
          "$swift_root/swift-6.4.2-RELEASE-ubuntu22.04/usr/bin/swift" build -c release \
            --swift-sdks-path "$swift_root" --swift-sdk swift-6.4.2-RELEASE_wasm \
            --package-path "$RUNNER_TEMP/model-source/app" --scratch-path "$RUNNER_TEMP/model-build" \
            -Xswiftc -Xclang-linker -Xswiftc -mexec-model=reactor \
            -Xlinker --export=malloc -Xlinker --export=free -Xlinker --export=zerocon_model_request \
            -Xlinker -lwasi-emulated-signal -Xlinker -lwasi-emulated-mman -Xlinker -lwasi-emulated-process-clocks
          wasm=$(find "$RUNNER_TEMP/model-build" -name zerocon_model.wasm -type f -print -quit)
          test -n "$wasm"
          "$swift_root/swift-6.4.2-RELEASE-ubuntu22.04/usr/bin/llvm-objcopy" \
            --strip-debug --remove-section=name "$wasm" dist/pages-cache/zerocon_model.wasm
          if command -v wasm-opt >/dev/null 2>&1; then
            wasm-opt -O3 --enable-simd --enable-bulk-memory --enable-nontrapping-float-to-int \
              dist/pages-cache/zerocon_model.wasm -o dist/pages-cache/zerocon_model.wasm.opt \
              && mv dist/pages-cache/zerocon_model.wasm.opt dist/pages-cache/zerocon_model.wasm || true
          fi
          cp "$converter/LICENSE" dist/pages-cache/CONVERTER-LICENSE.txt

      - name: Fetch and pack the pinned dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 windows/server-swift/azooKey_dictionary_storage
          dictionary=windows/server-swift/azooKey_dictionary_storage
          node windows/scripts/generate-reverse-dictionary.mjs --source "$dictionary/Dictionary/louds" \
            --output "$RUNNER_TEMP/reverse-v2.bin"
          python3 web/pack-dictionary.py "$dictionary/Dictionary" dist/pages-cache/dictionary.gz \
            --reverse "$RUNNER_TEMP/reverse-v2.bin"
          cp "$dictionary/LICENSE" dist/pages-cache/DICTIONARY-LICENSE.txt

      - name: Assemble site, fetch latest catalog model, verify, and optimize for Cloudflare Pages
        run: |
          cp dist/pages-cache/zerocon_llama_mt.mjs dist/pages/
          cp dist/pages-cache/zerocon_llama_mt.wasm dist/pages/
          cp dist/pages-cache/zerocon_llama_mt.worker.* dist/pages/ 2>/dev/null || true
          cp dist/pages-cache/zerocon_model.wasm dist/pages/
          cp dist/pages-cache/dictionary.gz dist/pages/
          cp dist/pages-cache/reverse-v2.bin.gz dist/pages/
          cp dist/pages-cache/DICTIONARY-LICENSE.txt dist/pages/
          cp dist/pages-cache/CONVERTER-LICENSE.txt dist/pages/
          cp dist/pages-cache/LLAMA-LICENSE.txt dist/pages/

          # Fetch latest default model directly from windows/deployment/model-catalog.json and write asset-manifest.json
          python3 web/pack-model.py dist/pages --cache-dir "$RUNNER_TEMP/model-cache"
          python3 web/pack-candidate-window.py dist/pages/candidate-window.html
          python3 web/pack-reading-window.py dist/pages/reading-window.html

          node --test --test-name-pattern='^(empty candidates|short candidate lists|long candidate lists|render ranges|render range|selection indices|selection scrolling)' windows/crates/ui/tests/candidate_scroller.test.cjs
          (cd web && npm ci --ignore-scripts --no-audit)
          cp -R web/node_modules/@bjorn3/browser_wasi_shim dist/pages/wasi

          # Verify multi-threaded Wasm engines before Cloudflare gzip/chunking
          node web/check-model-wasm.mjs dist/pages
          node web/check-model-assist.mjs dist/pages
          node web/check-model-learning.mjs dist/pages

          # Gzip large Wasm, generate SHA-256 asset-manifest, split any >24 MiB files, and write COOP/COEP _headers
          python3 web/pack-cloudflare-assets.py dist/pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/pages --project-name=zeroconvert-ime --branch=main
