name: Browser Wasm smoke test

on:
  push:
    branches: [web-pages-smoke]

permissions:
  contents: read

concurrency:
  group: github-pages-smoke
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the pinned dictionary
        run: git submodule update --init --depth 1 windows/server-swift/azooKey_dictionary_storage
      - name: Fetch Swift and its WASI SDK
        run: |
          swift_root="$RUNNER_TEMP/zerocon-swift"
          mkdir -p "$swift_root"
          cd "$swift_root"
          server=https://download.swift.org/swift-6.4.2-release
          curl --fail --silent --show-error --location --retry 3 "$server/ubuntu2204/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu22.04.tar.gz" -o swift-linux.tar.gz
          curl --fail --silent --show-error --location --retry 3 "$server/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz" -o swift-wasm.tar.gz
          echo 'c3081b1817117c66e4764d2a148357d997200048922c778b0f08c795833ae06d  swift-linux.tar.gz' | sha256sum --check
          echo '83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5  swift-wasm.tar.gz' | sha256sum --check
          tar -xzf swift-linux.tar.gz
          tar -xzf swift-wasm.tar.gz
      - name: Build and check the shared engine
        run: |
          cargo rustc --locked --manifest-path engine/rust/Cargo.toml --target wasm32-wasip1 --release --lib --crate-type cdylib -- -C link-arg=--export=malloc -C link-arg=--export=free
          node web/check-assist-wasm.cjs engine/rust/target/wasm32-wasip1/release/zerocon_engine.wasm
          mkdir -p dist/pages-smoke
          cp web/pages/* dist/pages-smoke/
          cp engine/rust/target/wasm32-wasip1/release/zerocon_engine.wasm dist/pages-smoke/
          cp windows/LICENSE dist/pages-smoke/LICENSE.txt
      - name: Build and check the shared Swift dictionary
        run: |
          swift_root="$RUNNER_TEMP/zerocon-swift"
          converter=$(python3 windows/scripts/prepare-modern-llama.py --converter-only | python3 -c 'import json,sys; print(json.load(sys.stdin)["converter"])')
          python3 web/stage-dictionary.py "$converter" "$RUNNER_TEMP/dictionary-source"
          "$swift_root/swift-6.4.2-RELEASE-ubuntu22.04/usr/bin/swift" build -c release \
            --swift-sdks-path "$swift_root" --swift-sdk swift-6.4.2-RELEASE_wasm \
            --package-path "$RUNNER_TEMP/dictionary-source/app" --scratch-path "$RUNNER_TEMP/dictionary-build" \
            -Xswiftc -Xclang-linker -Xswiftc -mexec-model=reactor \
            -Xlinker --export=malloc -Xlinker --export=free -Xlinker --export=zerocon_dictionary_convert
          wasm=$(find "$RUNNER_TEMP/dictionary-build" -name zerocon_dictionary.wasm -type f -print -quit)
          test -n "$wasm"
          cp "$wasm" dist/pages-smoke/
          dictionary=windows/server-swift/azooKey_dictionary_storage
          python3 web/pack-dictionary.py "$dictionary/Dictionary" dist/pages-smoke/dictionary.gz
          cp "$dictionary/LICENSE" dist/pages-smoke/DICTIONARY-LICENSE.txt
          cp "$converter/LICENSE" dist/pages-smoke/CONVERTER-LICENSE.txt
          (cd web && npm ci --ignore-scripts --no-audit)
          cp -R web/node_modules/@bjorn3/browser_wasi_shim dist/pages-smoke/wasi
          node web/check-dictionary-wasm.mjs dist/pages-smoke
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages-smoke

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
